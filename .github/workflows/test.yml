name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 'lts/*']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Install the packed library and CLI
        run: |
          tarball=$(npm pack --silent)
          npm install --prefix "$RUNNER_TEMP/consumer" "$PWD/$tarball"
          cd "$RUNNER_TEMP/consumer"
          node --input-type=module -e "import { compareProducts } from 'drogasil-cli'; if (typeof compareProducts !== 'function') process.exit(1)"
          ./node_modules/.bin/drogasil compare --help
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm ci --prefix mcp
      - run: npm test --prefix mcp
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reproducible plugin packaging
        run: |
          for build in first second; do
            python3 scripts/package-plugin.py --app-id asdk_app_fixture --output "$RUNNER_TEMP/$build.zip"
          done
          cmp "$RUNNER_TEMP/first.zip" "$RUNNER_TEMP/second.zip"
          unzip -t "$RUNNER_TEMP/first.zip"
          for skill in skills/*/SKILL.md; do
            unzip -p "$RUNNER_TEMP/first.zip" "$skill" | cmp "$skill" -
          done
  parity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - release: main
            pm: main
            dsp: main
            flags: ''
          - release: tested
            pm: fc2f7de1a61bf2f6dcef877ff8c90128ebcd8bd7
            dsp: 6cc370702e0bd25fcca6d2cbf46fa9c5e9934bb0
            flags: --strict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm ci --prefix mcp
      - run: node scripts/parity/contract.mjs
      - run: node scripts/parity/cli.mjs drogasil bin/drogasil.js --strict
      - uses: actions/checkout@v4
        with:
          repository: godely/paguemenos-cli
          ref: ${{ matrix.pm }}
          path: partners/paguemenos
      - uses: actions/checkout@v4
        with:
          repository: godely/drogariasaopaulo-cli
          ref: ${{ matrix.dsp }}
          path: partners/drogariasaopaulo
      - name: Check both standalone clients against the Drogasil contract
        run: |
          for partner in paguemenos drogariasaopaulo; do
            npm ci --prefix "partners/$partner"
            npm test --prefix "partners/$partner"
            node scripts/parity/cli.mjs "$partner" "partners/$partner/cli.js" ${{ matrix.flags }} | tee -a "$GITHUB_STEP_SUMMARY"
          done
        shell: bash
